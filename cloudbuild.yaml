steps:
  - id: verify-backend
    name: mcr.microsoft.com/dotnet/sdk:9.0
    entrypoint: bash
    args:
      - -c
      - |
        dotnet restore Syntwin.Backend.slnx
        dotnet build Syntwin.Backend.slnx \
          --configuration Release \
          --no-restore
        dotnet test tests/Syntwin.Application.Tests/Syntwin.Application.Tests.csproj \
          --configuration Release \
          --no-build

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - src/Syntwin.Api/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/syntwin-api:${_IMAGE_TAG}
      - .

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - src/Syntwin.Worker/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/syntwin-worker:${_IMAGE_TAG}
      - .

  - id: build-db-migrator
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - src/Syntwin.DbMigrator/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/syntwin-db-migrator:${_IMAGE_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/syntwin-api:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/syntwin-worker:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/syntwin-db-migrator:${_IMAGE_TAG}

substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: syntwin-staging
  _IMAGE_TAG: $SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
